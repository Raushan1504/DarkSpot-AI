<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" style="background: #09090b; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Card Container -->
  <rect x="30" y="20" width="900" height="380" rx="16" fill="url(#card-bg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Header -->
  <rect x="50" y="42" width="28" height="28" rx="6" fill="#78350f" fill-opacity="0.4"/>
  <text x="58" y="61" fill="#f59e0b" font-size="16">⇄</text>
  <text x="88" y="61" fill="#f4f4f5" font-size="16" font-weight="700">Contradiction: Monthly Living Allowance (Stipend Amount)</text>

  <rect x="740" y="44" width="170" height="24" rx="12" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1"/>
  <text x="765" y="60" fill="#fca5a5" font-size="11" font-weight="700">DIRECT DISCREPANCY</text>

  <line x1="50" y1="88" x2="910" y2="88" stroke="#27272a" stroke-width="1"/>

  <!-- Left Column: Source A -->
  <rect x="50" y="105" width="415" height="185" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <rect x="65" y="120" width="180" height="24" rx="6" fill="#27272a" stroke="#52525b" stroke-width="0.8"/>
  <text x="75" y="136" fill="#fbbf24" font-size="11" font-weight="700" font-family="monospace">[src-1] DAAD Official Portal 2026</text>
  
  <rect x="375" y="120" width="75" height="22" rx="11" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8"/>
  <text x="388" y="135" fill="#6ee7b7" font-size="10" font-weight="700">2026 Active</text>

  <text x="65" y="165" fill="#a1a1aa" font-size="10" font-weight="700" letter-spacing="1">VERBATIM STATEMENT A:</text>
  <rect x="65" y="175" width="385" height="95" rx="8" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="80" y="202" fill="#e4e4e7" font-size="12" font-family="monospace">“A monthly scholarship installment</text>
  <text x="80" y="222" fill="#fbbf24" font-size="13" font-weight="700" font-family="monospace">of €934 is disbursed to undergraduate</text>
  <text x="80" y="242" fill="#e4e4e7" font-size="12" font-family="monospace">scholars for the 2026 funding tenure.”</text>

  <!-- Right Column: Source B -->
  <rect x="495" y="105" width="415" height="185" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <rect x="510" y="120" width="180" height="24" rx="6" fill="#27272a" stroke="#52525b" stroke-width="0.8"/>
  <text x="520" y="136" fill="#fb923c" font-size="11" font-weight="700" font-family="monospace">[src-2] EduGermany Forum (2023)</text>

  <rect x="820" y="120" width="75" height="22" rx="11" fill="#78350f" fill-opacity="0.5" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="833" y="135" fill="#fcd34d" font-size="10" font-weight="700">Stale Cycle</text>

  <text x="510" y="165" fill="#a1a1aa" font-size="10" font-weight="700" letter-spacing="1">VERBATIM STATEMENT B:</text>
  <rect x="510" y="175" width="385" height="95" rx="8" fill="#09090b" stroke="#ea580c" stroke-width="1.5"/>
  <text x="525" y="202" fill="#e4e4e7" font-size="12" font-family="monospace">“Selected scholars receive a monthly</text>
  <text x="525" y="222" fill="#fb923c" font-size="13" font-weight="700" font-family="monospace">allowance of €861 plus a fixed</text>
  <text x="525" y="242" fill="#e4e4e7" font-size="12" font-family="monospace">travel lump-sum.”</text>

  <!-- Divergence Diagnosis Box -->
  <rect x="50" y="305" width="860" height="75" rx="10" fill="#451a03" fill-opacity="0.3" stroke="#d97706" stroke-width="1"/>
  <text x="68" y="328" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1">DIVERGENCE DIAGNOSIS (TEMPORAL DRIFT):</text>
  <text x="68" y="352" fill="#fef3c7" font-size="12.5">Source 2 is an outdated 2023 third-party post reflecting pre-inflation rates (€861), while Source 1 is the official</text>
  <text x="68" y="370" fill="#fef3c7" font-size="12.5">2026 DAAD circular mandating €934/month. Applying based on Source 2 risks budget shortfall and visa rejection.</text>
</svg>
