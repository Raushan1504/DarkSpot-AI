<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #09090b; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="40" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">DarkSpot <tspan fill="#f59e0b">AI</tspan> — System Architecture</text>
  <text x="40" y="74" fill="#a1a1aa" font-size="13">High-Stakes Decision Audit Pipeline &amp; Epistemic Gap Detection</text>
  <rect x="40" y="90" width="880" height="1" fill="#27272a"/>

  <!-- Stage 1: Intake -->
  <rect x="40" y="115" width="250" height="320" rx="16" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="40" y="115" width="250" height="4" rx="2" fill="#3b82f6"/>
  <text x="60" y="145" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1">1. MULTI-SOURCE INGESTION</text>
  
  <rect x="56" y="165" width="218" height="60" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="70" y="190" fill="#f4f4f5" font-size="12" font-weight="600">Research Topic / Goal</text>
  <text x="70" y="208" fill="#a1a1aa" font-size="10">Scholarships, Visas, Grant Guidelines</text>

  <rect x="56" y="235" width="218" height="85" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="70" y="258" fill="#34d399" font-size="12" font-weight="600">Two-Tier Scraper &amp; Proxy</text>
  <text x="70" y="278" fill="#a1a1aa" font-size="10">• Chrome Browser Headers</text>
  <text x="70" y="296" fill="#a1a1aa" font-size="10">• Jina Reader (JS/Cloudflare bypass)</text>

  <rect x="56" y="330" width="218" height="85" rx="10" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
  <text x="70" y="354" fill="#c084fc" font-size="12" font-weight="600">Raw Government Circulars</text>
  <text x="70" y="374" fill="#d8b4fe" font-size="10">• Zero-403 PDF &amp; Gazette Text</text>
  <text x="70" y="392" fill="#a1a1aa" font-size="10">• Scanned Intranet &amp; Bulletin Excerpts</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 275 L 340 275" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="340,270 350,275 340,280" fill="#f59e0b"/>

  <!-- Stage 2: Epistemic Reasoning Core -->
  <rect x="355" y="115" width="250" height="320" rx="16" fill="url(#grad-card)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="355" y="115" width="250" height="4" rx="2" fill="url(#grad-gold)"/>
  <text x="375" y="145" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1">2. EPISTEMIC AUDIT CORE</text>

  <rect x="371" y="165" width="218" height="75" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="385" y="190" fill="#fbbf24" font-size="12" font-weight="600">Cross-Document Diffing</text>
  <text x="385" y="210" fill="#a1a1aa" font-size="10">• Closed-World Assumption Breaker</text>
  <text x="385" y="226" fill="#a1a1aa" font-size="10">• Verbatim Quote Comparison</text>

  <rect x="371" y="250" width="218" height="75" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="385" y="275" fill="#f87171" font-size="12" font-weight="600">Omission Discovery (Dark Spots)</text>
  <text x="385" y="295" fill="#a1a1aa" font-size="10">• Hidden Prerequisites &amp; Bonds</text>
  <text x="385" y="311" fill="#a1a1aa" font-size="10">• Decision Risk &amp; Mandatory Questions</text>

  <rect x="371" y="335" width="218" height="80" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="385" y="360" fill="#38bdf8" font-size="12" font-weight="600">Temporal Drift Engine</text>
  <text x="385" y="380" fill="#a1a1aa" font-size="10">• Compares Deadlines vs 2026 Cycle</text>
  <text x="385" y="396" fill="#a1a1aa" font-size="10">• Flags Obsolete Rates (€861 vs €934)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 615 275 L 655 275" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="655,270 665,275 655,280" fill="#f59e0b"/>

  <!-- Stage 3: Verification Output & Action -->
  <rect x="670" y="115" width="250" height="320" rx="16" fill="url(#grad-card)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="670" y="115" width="250" height="4" rx="2" fill="#10b981"/>
  <text x="690" y="145" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">3. ACTIONABLE VERIFICATION</text>

  <rect x="686" y="165" width="218" height="60" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="700" y="190" fill="#f87171" font-size="11" font-weight="700">Tab 1: Dark Spots (Gaps)</text>
  <text x="700" y="208" fill="#a1a1aa" font-size="10">Explicit Epistemic Humility Badges</text>

  <rect x="686" y="233" width="218" height="60" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="700" y="258" fill="#fbbf24" font-size="11" font-weight="700">Tab 2: Side-by-Side Diff</text>
  <text x="700" y="276" fill="#a1a1aa" font-size="10">Source A quote vs Source B quote</text>

  <rect x="686" y="301" width="218" height="55" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="700" y="324" fill="#34d399" font-size="11" font-weight="700">Tab 3: Verified Baseline</text>
  <text x="700" y="342" fill="#a1a1aa" font-size="10">Consensus Facts with Source Provenance</text>

  <rect x="686" y="364" width="218" height="55" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="700" y="386" fill="#a5b4fc" font-size="11" font-weight="700">Official Clarification Draft</text>
  <text x="700" y="404" fill="#818cf8" font-size="10">Multilingual: EN • FR • ES • DE • HI</text>
</svg>
